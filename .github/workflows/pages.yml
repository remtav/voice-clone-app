name: Deploy demo to GitHub Pages

# Publishes the static UI mockup in docs/ to GitHub Pages.
# This is a non-functional preview of the front-end; the real app needs a GPU
# backend and cannot run on Pages.
#
# The configure-pages step below sets enablement: true, so it turns Pages on
# automatically on the first run. If your org restricts that, enable it once
# manually: Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  push:
    branches: ["claude/cool-bell-fsdhzk", "main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on automatically on the first run, so no manual
          # Settings > Pages toggle is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
