name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: Install Python deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests scripts trainer
      - name: Test (fake engine, no GPU)
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          echo "TUNNEL_TOKEN=dummy" >> .env
          docker compose config -q
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  # On every push to main (a merged PR), once tests pass: build the app image
  # (Qwen3-TTS engine) and push it to Docker Hub as <user>/voice-clone-app.
  # Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (see
  # README, "Pre-built image"); without them the job skips its steps.
  publish:
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-image
      cancel-in-progress: true
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Docker Hub secrets missing
        if: env.HAS_DOCKERHUB != 'true'
        run: echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set; image not published."
      - name: Free disk space (the CUDA base image needs ~15 GB)
        if: env.HAS_DOCKERHUB == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
        if: env.HAS_DOCKERHUB == 'true'
      - uses: docker/setup-buildx-action@v3
        if: env.HAS_DOCKERHUB == 'true'
      - uses: docker/login-action@v3
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        if: env.HAS_DOCKERHUB == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/voice-clone-app
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        if: env.HAS_DOCKERHUB == 'true'
        with:
          # The checked-out directory, not the git URL: the image's build stamp reads .git.
          context: .
          target: app
          build-args: TTS_ENGINE=qwen
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse the dependency layers of the previous image when the requirements did not change.
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/voice-clone-app:latest
          cache-to: type=inline
